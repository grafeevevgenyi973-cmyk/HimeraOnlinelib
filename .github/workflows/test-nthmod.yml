
name: NTHMOD validation test

on:
  push:
    branches:
      - main
    paths:
      - "NTHMOD.so"
      - ".github/workflows/test-nthmod.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check NTHMOD.so
        run: |
          set -e
          test -f NTHMOD.so
          file NTHMOD.so
          readelf -h NTHMOD.so | tee elf-header.txt
          grep -q "ELF64" elf-header.txt
          grep -q "AArch64" elf-header.txt

      - name: Save original library
        uses: actions/upload-artifact@v4
        with:
          name: NTHMOD-validation-test
          path: |
            NTHMOD.so
            elf-header.txt
            
